html, body {
  margin: 0;
  padding: 0;
  width: 100%;
  height: 100%;
  background: var(--color-bg);
  color: var(--color-text);
  font-family: system-ui, -apple-system, Segoe UI, Roboto, sans-serif;
  overflow: hidden;
}

button {
  font-family: inherit;
  cursor: pointer;
}

#setup {
  position: fixed;
  inset: 0;
  display: flex;
  align-items: center;
  justify-content: center;
  padding: 24px;
  box-sizing: border-box;
  background:
    radial-gradient(circle at 20% 15%, rgba(var(--color-primary-rgb), 0.18), transparent 45%),
    radial-gradient(circle at 85% 85%, rgba(var(--color-primary-light-rgb), 0.12), transparent 50%),
    var(--color-bg-deep);
}

#setupCard {
  width: 100%;
  max-width: 460px;
  background: var(--color-panel-bg);
  backdrop-filter: blur(16px);
  border: 1px solid rgba(var(--color-white-rgb), 0.08);
  border-radius: 20px;
  box-shadow: 0 25px 60px rgba(var(--color-black-rgb), 0.6);
  padding: 32px 28px 28px;
  box-sizing: border-box;
  animation: setupIn 0.5s cubic-bezier(0.22, 1, 0.36, 1);
}

@keyframes setupIn {
  from { opacity: 0; transform: translateY(16px) scale(0.98); }
  to { opacity: 1; transform: translateY(0) scale(1); }
}

.setup-header {
  text-align: center;
  margin-bottom: 26px;
}

.setup-logo {
  width: auto;
  height: 192px;
  margin: 0 auto;
  background-image: var(--img-logo);
  background-size: contain;
  background-position: center;
  background-repeat: no-repeat;
}

#setup h1 {
  font-size: 2rem;
  font-weight: 800;
  margin: 0 0 6px;
  background: linear-gradient(90deg, var(--color-white), var(--color-primary-light));
  -webkit-background-clip: text;
  background-clip: text;
  color: transparent;
}

.setup-subtitle {
  font-size: 0.85rem;
  color: var(--color-text-muted);
  margin: 0;
}

.setup-step {
  display: flex;
  align-items: center;
  gap: 14px;
  padding: 14px 0;
  border-top: 1px solid rgba(var(--color-white-rgb), 0.07);
  text-align: left;
}

.setup-step:first-of-type {
  border-top: none;
  padding-top: 0;
}

.setup-step-num {
  flex: 0 0 28px;
  width: 28px;
  height: 28px;
  border-radius: 50%;
  background: rgba(var(--color-primary-rgb), 0.15);
  border: 1px solid rgba(var(--color-primary-light-rgb), 0.4);
  color: var(--color-primary-light);
  font-size: 0.85rem;
  font-weight: 700;
  display: flex;
  align-items: center;
  justify-content: center;
}

.setup-step-body {
  flex: 1;
  min-width: 0;
}

.setup-step-title {
  font-size: 0.95rem;
  font-weight: 600;
  color: var(--color-white);
  display: flex;
  align-items: center;
  gap: 8px;
  margin-bottom: 2px;
}

.optional-tag {
  font-size: 0.65rem;
  font-weight: 600;
  text-transform: uppercase;
  letter-spacing: 0.5px;
  color: var(--color-text-muted-light);
  background: rgba(var(--color-white-rgb), 0.08);
  padding: 2px 6px;
  border-radius: 4px;
}

.status-text {
  font-size: 0.8rem;
  color: var(--color-text-muted);
  line-height: 1.35;
}

.status-text.success {
  color: var(--color-success);
}

.setup-btn {
  flex: 0 0 auto;
  background: var(--color-primary);
  color: var(--color-white);
  border: none;
  border-radius: 8px;
  padding: 10px 16px;
  font-size: 0.85rem;
  font-weight: 600;
  white-space: nowrap;
  transition: background 0.15s, transform 0.15s;
}

.setup-btn:hover { background: var(--color-primary-hover); transform: translateY(-1px); }

.setup-btn-secondary {
  background: rgba(var(--color-white-rgb), 0.08);
  color: var(--color-text);
  border: 1px solid rgba(var(--color-white-rgb), 0.14);
}

.setup-btn-secondary:hover { background: rgba(var(--color-white-rgb), 0.14); }

.setup-btn:disabled {
  background: var(--color-disabled-bg);
  color: var(--color-disabled-text);
  border-color: transparent;
  cursor: not-allowed;
  transform: none;
}

.setup-start-btn {
  width: 100%;
  margin-top: 24px;
  padding: 16px;
  font-size: 1.05rem;
  font-weight: 700;
  letter-spacing: 0.3px;
  border: none;
  border-radius: 12px;
  color: var(--color-white);
  background: linear-gradient(135deg, var(--color-primary), var(--color-primary-light));
  box-shadow: 0 10px 30px rgba(var(--color-primary-rgb), 0.35);
  transition: transform 0.15s, box-shadow 0.15s;
}

.setup-start-btn:hover:not(:disabled) {
  transform: translateY(-2px);
  box-shadow: 0 14px 36px rgba(var(--color-primary-rgb), 0.5);
}

.setup-start-btn:disabled {
  background: var(--color-disabled-bg);
  color: var(--color-disabled-text);
  box-shadow: none;
  cursor: not-allowed;
}

#player {
  position: fixed;
  inset: 0;
  background: var(--color-bg);
  display: none;
}

#player.active { display: block; }

#topProgressBar {
  position: fixed;
  top: 0;
  left: 0;
  width: 100%;
  height: 3px;
  background: rgba(var(--color-white-rgb), 0.15);
  z-index: 20;
  pointer-events: none;
}

#topProgressBarFill {
  height: 100%;
  width: 100%;
  transform: scaleX(0);
  transform-origin: left;
  background: linear-gradient(90deg, var(--color-primary), var(--color-primary-light));
}

video {
  width: 100%;
  height: 100%;
  object-fit: contain;
  background: var(--color-bg);
}

#hud {
  position: fixed;
  top: 12px;
  left: 12px;
  right: 12px;
  display: flex;
  justify-content: space-between;
  font-size: 0.8rem;
  color: var(--color-text-dim);
  text-shadow: 0 1px 3px rgba(var(--color-black-rgb), 0.8);
  pointer-events: none;
  opacity: 0;
  transition: opacity 0.3s;
}

#player.controls-visible #hud { opacity: 1; }

#controls {
  position: fixed;
  bottom: 12px;
  left: 50%;
  transform: translateX(-50%);
  display: flex;
  gap: 10px;
  opacity: 0;
  transition: opacity 0.3s;
  pointer-events: none;
}

#player.controls-visible #controls { opacity: 1; pointer-events: auto; }

#controls button {
  background: var(--color-controls-bg);
  color: var(--color-white);
  border: none;
  border-radius: 8px;
  padding: 8px 14px;
  font-size: 0.85rem;
}

#controls button:hover { background: var(--color-controls-bg-hover); }

#progressContainer {
  position: fixed;
  bottom: 60px;
  left: 50%;
  transform: translateX(-50%);
  display: flex;
  align-items: center;
  gap: 10px;
  width: min(70vw, 700px);
  opacity: 0;
  transition: opacity 0.3s;
  pointer-events: none;
}

#player.controls-visible #progressContainer { opacity: 1; pointer-events: auto; }

#timeCurrent, #timeDuration {
  font-size: 0.75rem;
  color: var(--color-text-dim-light);
  text-shadow: 0 1px 3px rgba(var(--color-black-rgb), 0.8);
  min-width: 38px;
  text-align: center;
  font-variant-numeric: tabular-nums;
}

#progressBar {
  flex: 1;
  -webkit-appearance: none;
  appearance: none;
  height: 6px;
  border-radius: 3px;
  cursor: pointer;
  background: linear-gradient(to right, var(--color-primary) var(--progress, 0%), rgba(var(--color-white-rgb), 0.25) var(--progress, 0%));
}

#progressBar::-webkit-slider-thumb {
  -webkit-appearance: none;
  appearance: none;
  width: 14px;
  height: 14px;
  border-radius: 50%;
  background: var(--color-white);
  box-shadow: 0 0 4px rgba(var(--color-black-rgb), 0.6);
  margin-top: 0;
  transition: transform 0.15s;
}

#progressBar::-webkit-slider-thumb:hover { transform: scale(1.2); }

#progressBar::-moz-range-track {
  height: 6px;
  border-radius: 3px;
  background: rgba(var(--color-white-rgb), 0.25);
}

#progressBar::-moz-range-progress {
  height: 6px;
  border-radius: 3px;
  background: var(--color-primary);
}

#progressBar::-moz-range-thumb {
  width: 14px;
  height: 14px;
  border: none;
  border-radius: 50%;
  background: var(--color-white);
  box-shadow: 0 0 4px rgba(var(--color-black-rgb), 0.6);
}

#titlePopup {
  position: fixed;
  left: 0;
  bottom: 10%;
  width: 100%;
  display: flex;
  align-items: stretch;
  pointer-events: none;
  z-index: 10;
  transform: translateY(180%);
  opacity: 0;
  transition: transform 0.55s cubic-bezier(0.22, 1, 0.36, 1), opacity 0.4s ease;

  &:before {
    content: "";
    background-image: var(--img-logo);
    width: 16em;
    height: 16em;
    background-size: contain;
    background-position: center;
    background-repeat: no-repeat;
    position: absolute;
    bottom: calc(100% - 3.8em);
    left: 0.4em;
    z-index: 1;
  }
}

#titlePopup.show {
  transform: translateY(0);
  opacity: 1;
}

#titlePopupBar {
  display: flex;
  align-items: stretch;
  max-width: 88vw;
  margin-left: 4vw;
  box-shadow: 0 12px 40px rgba(var(--color-black-rgb), 0.55);
  clip-path: polygon(0 0, 100% 0, calc(100% - 26px) 100%, 0 100%);
  overflow: hidden;
  transition: width 0.35s cubic-bezier(0.22, 1, 0.36, 1);
}

#titlePopupAccent {
  flex: 0 0 10px;
  background: linear-gradient(180deg, var(--color-primary-light), var(--color-primary));
}

#titlePopupContent {
  background: linear-gradient(90deg, rgba(var(--color-titlepopup-bg-rgb), 0.94) 0%, rgba(var(--color-titlepopup-bg-rgb), 0.86) 70%, rgba(var(--color-titlepopup-bg-rgb), 0.55) 100%);
  padding: 18px 70px 20px 24px;
  display: flex;
  flex-direction: column;
  justify-content: center;
  gap: 4px;
}

#titlePopupEyebrow {
  font-size: 0.8rem;
  font-weight: 700;
  letter-spacing: 3px;
  text-transform: uppercase;
  color: var(--color-primary-light);
  transition: opacity 0.2s ease, transform 0.2s ease;
}

#titlePopupTitle {
  font-size: clamp(1.1rem, 2.6vw, 2.1rem);
  font-weight: 700;
  letter-spacing: 0.5px;
  color: var(--color-white);
  text-shadow: 0 2px 8px rgba(var(--color-black-rgb), 0.6);
  white-space: nowrap;
  overflow: hidden;
  max-width: 78vw;
  transition: opacity 0.2s ease, transform 0.2s ease;
}

#titlePopupEyebrow.swap-out,
#titlePopupTitle.swap-out {
  opacity: 0;
  transform: translateY(10px);
}

</style>
</head>
<body>

<div id="setup">
  <div id="setupCard">
    <div class="setup-header">
      <div class="setup-logo"></div>
      <h1>Randomian</h1>
      <p class="setup-subtitle">Ordner wählen, mischen lassen, Vollbild genießen.</p>
    </div>

    <div class="setup-step">
      <div class="setup-step-num">1</div>
      <div class="setup-step-body">
        <div class="setup-step-title">Videos</div>
        <div id="status" class="status-text">Ordner mit Videos auswählen, um zu starten.</div>
      </div>
      <button id="pickBtn" class="setup-btn">Ordner wählen</button>
    </div>

    <div class="setup-step">
      <div class="setup-step-num">2</div>
      <div class="setup-step-body">
        <div class="setup-step-title">Spots <span class="optional-tag">optional</span></div>
        <div id="spotStatus" class="status-text">Laufen alle 3–6 Videos dazwischen, ohne Bauchbinde.</div>
      </div>
      <button id="pickSpotsBtn" class="setup-btn setup-btn-secondary">Ordner wählen</button>
    </div>

    <div class="setup-step">
      <div class="setup-step-num">3</div>
      <div class="setup-step-body">
        <div class="setup-step-title">Logging <span class="optional-tag">optional</span></div>
        <div id="logStatus" class="status-text">Ohne Bestätigung wird nicht geloggt.</div>
      </div>
      <button id="pickLogFileBtn" class="setup-btn setup-btn-secondary">history.log wählen</button>
    </div>

    <button id="startBtn" class="setup-start-btn" disabled>▶ Vollbild &amp; Start</button>
  </div>
</div>

<div id="player">
  <video id="video" autoplay></video>
  <div id="topProgressBar">
    <div id="topProgressBarFill"></div>
  </div>
  <div id="hud">
    <span id="fileName"></span>
    <span id="counter"></span>
  </div>
  <div id="progressContainer">
    <span id="timeCurrent">0:00</span>
    <input type="range" id="progressBar" min="0" max="100" value="0" step="0.1">
    <span id="timeDuration">0:00</span>
  </div>
  <div id="controls">
    <button id="prevBtn">⏮ Zurück</button>
    <button id="pauseBtn">⏸ Pause</button>
    <button id="nextBtn">⏭ Weiter</button>
    <button id="reshuffleBtn">🔀 Neu mischen</button>
    <button id="exitBtn">✕ Beenden</button>
  </div>
  <div id="titlePopup">
    <div id="titlePopupBar">
      <div id="titlePopupAccent"></div>
      <div id="titlePopupContent">
        <div id="titlePopupEyebrow">Jetzt läuft</div>
        <div id="titlePopupTitle"></div>
      </div>
    </div>
  </div>
</div>

<script>
const VIDEO_EXTENSIONS = ['mp4', 'webm', 'ogg', 'ogv', 'mov', 'mkv', 'avi', 'm4v', 'wmv'];

const setupEl = document.getElementById('setup');
const statusEl = document.getElementById('status');
const pickBtn = document.getElementById('pickBtn');
const spotStatusEl = document.getElementById('spotStatus');
const pickSpotsBtn = document.getElementById('pickSpotsBtn');
const logStatusEl = document.getElementById('logStatus');
const pickLogFileBtn = document.getElementById('pickLogFileBtn');
const startBtn = document.getElementById('startBtn');

const playerEl = document.getElementById('player');
const videoEl = document.getElementById('video');
const fileNameEl = document.getElementById('fileName');
const counterEl = document.getElementById('counter');
const prevBtn = document.getElementById('prevBtn');
const pauseBtn = document.getElementById('pauseBtn');
const nextBtn = document.getElementById('nextBtn');
const reshuffleBtn = document.getElementById('reshuffleBtn');
const exitBtn = document.getElementById('exitBtn');
const titlePopupEl = document.getElementById('titlePopup');
const titlePopupBarEl = document.getElementById('titlePopupBar');
const titlePopupEyebrowEl = document.getElementById('titlePopupEyebrow');
const titlePopupTitleEl = document.getElementById('titlePopupTitle');
const progressBar = document.getElementById('progressBar');
const topProgressBarEl = document.getElementById('topProgressBar');
const topProgressBarFill = document.getElementById('topProgressBarFill');
const timeCurrentEl = document.getElementById('timeCurrent');
const timeDurationEl = document.getElementById('timeDuration');

const END_POPUP_LEAD_TIME = 10; // Sekunden vor Videoende erneut einblenden
const END_POPUP_VISIBLE_TIME = 5000; // ms, die die Bauchbinde davor stehen bleibt
const START_POPUP_DELAY = 5000; // ms nach Videostart, bevor die Bauchbinde erscheint
const START_POPUP_VISIBLE_TIME = 5000; // ms, die die Bauchbinde danach stehen bleibt
const CONTROLS_HIDE_DELAY = 2500; // ms Inaktivität, bis die Steuerelemente verschwinden

let playlist = [];
let currentIndex = -1;
let spotPlaylist = [];
let spotQueueIndex = 0;
let videosSinceSpot = 0;
let spotThreshold = randomSpotThreshold();
let isSpotPlaying = false;
let currentObjectUrl = null;
let endingPopupShown = false;
let isSeeking = false;
let titlePopupShowTimeout = null;
let titlePopupHideTimeout = null;
let titlePopupWidthResetTimeout = null;
let controlsHideTimeout = null;
let consecutiveErrors = 0;

function safePlay() {
  videoEl.play().catch((err) => {
    // AbortError: Quelle wurde durch schnelles Weiterschalten ersetzt.
    // NotSupportedError: wird zusätzlich über das error-Event behandelt.
    if (err.name !== 'AbortError' && err.name !== 'NotSupportedError') {
      console.warn('Wiedergabe konnte nicht gestartet werden:', err);
    }
  });
}

function updatePauseButton() {
  pauseBtn.textContent = videoEl.paused ? '▶ Weiter' : '⏸ Pause';
}

function scheduleControlsHide() {
  clearTimeout(controlsHideTimeout);
  controlsHideTimeout = setTimeout(() => {
    if (isSeeking) {
      scheduleControlsHide();
    } else {
      playerEl.classList.remove('controls-visible');
    }
  }, CONTROLS_HIDE_DELAY);
}

function showControls() {
  playerEl.classList.add('controls-visible');
  scheduleControlsHide();
}

function formatTime(seconds) {
  if (!isFinite(seconds) || seconds < 0) return '0:00';
  const m = Math.floor(seconds / 60);
  const s = Math.floor(seconds % 60);
  return `${m}:${String(s).padStart(2, '0')}`;
}

function stripExtension(name) {
  return name.replace(/\.[^./\\]+$/, '');
}

function formatTitleForDisplay(name) {
  const title = stripExtension(name);
  // Unterstriche nur durch Leerzeichen ersetzen, wenn der Titel noch keine echten Leerzeichen hat
  // (sonst würden z. B. "mein_video 2" und "mein video_2" ununterscheidbar werden).
  return title.includes(' ') ? title : title.replace(/_/g, ' ');
}

let logFileHandle = null;

async function pickLogFile() {
  if (!window.showSaveFilePicker) {
    logStatusEl.textContent = 'Direktes Datei-Logging wird von diesem Browser nicht unterstützt (nur Chrome/Edge).';
    return;
  }
  try {
    logFileHandle = await window.showSaveFilePicker({
      suggestedName: 'history.log',
      types: [{ description: 'Log-Datei', accept: { 'text/plain': ['.log', '.txt'] } }],
    });
    logStatusEl.textContent = `✓ Log-Datei gewählt: ${logFileHandle.name}`;
    logStatusEl.classList.add('success');
  } catch (err) {
    if (err.name !== 'AbortError') {
      logStatusEl.classList.remove('success');
      logStatusEl.textContent = 'Fehler beim Wählen der Log-Datei: ' + err.message;
    }
  }
}

// Schreibzugriffe laufen nacheinander: createWritable() sperrt die Datei, parallele Aufrufe würden Zeilen verlieren.
let logQueue = Promise.resolve();

function appendToLogFile(line) {
  if (!logFileHandle) return;
  const handle = logFileHandle;
  logQueue = logQueue.then(async () => {
    try {
      const file = await handle.getFile();
      const writable = await handle.createWritable({ keepExistingData: true });
      await writable.write({ type: 'write', position: file.size, data: line });
      await writable.close();
    } catch (err) {
      console.warn('Konnte Log-Zeile nicht in die Datei schreiben:', err);
    }
  });
}

function logPlaybackStart(file, type) {
  if (!logFileHandle) return;
  const label = new Date().toLocaleString('de-DE');
  const line = `[${label}] ${type === 'spot' ? 'Spot' : 'Video'} gestartet: ${file.name}\n`;
  appendToLogFile(line);
}

const TITLE_MIN_FONT_SIZE = 14; // px, Untergrenze beim Schrumpfen überlanger Titel

function fitTitleFontSize() {
  titlePopupTitleEl.style.fontSize = ''; // zurück auf den responsiven CSS-Wert (clamp)
  const available = titlePopupTitleEl.clientWidth;
  if (!available || titlePopupTitleEl.scrollWidth <= available) return;

  const baseSize = parseFloat(getComputedStyle(titlePopupTitleEl).fontSize);
  let size = Math.max(baseSize * (available / titlePopupTitleEl.scrollWidth), TITLE_MIN_FONT_SIZE);
  titlePopupTitleEl.style.fontSize = `${size}px`;

  // Sicherheitsnetz: Kerning/Rundung kann knapp danebenliegen, notfalls nachschärfen.
  let guard = 0;
  while (titlePopupTitleEl.scrollWidth > titlePopupTitleEl.clientWidth && size > TITLE_MIN_FONT_SIZE && guard < 5) {
    size = Math.max(size - 1, TITLE_MIN_FONT_SIZE);
    titlePopupTitleEl.style.fontSize = `${size}px`;
    guard++;
  }
}

function showTitlePopup(text, eyebrow = 'Jetzt läuft', autoHideDelay = null) {
  clearTimeout(titlePopupHideTimeout);

  if (!titlePopupEl.classList.contains('show')) {
    // Bauchbinde ist aktuell weg: einmalig von unten reinfahren.
    titlePopupEyebrowEl.textContent = eyebrow;
    titlePopupTitleEl.textContent = text;
    fitTitleFontSize();
    titlePopupEl.classList.add('show');
  } else {
    // Bauchbinde steht bereits (Übergang zwischen zwei Videos): nur Text animiert tauschen,
    // die Balkenbreite wird dabei sanft an den neuen Text angepasst.
    clearTimeout(titlePopupWidthResetTimeout);
    const startWidth = titlePopupBarEl.getBoundingClientRect().width;
    titlePopupBarEl.style.width = `${startWidth}px`;

    titlePopupEyebrowEl.classList.add('swap-out');
    titlePopupTitleEl.classList.add('swap-out');
    setTimeout(() => {
      titlePopupEyebrowEl.textContent = eyebrow;
      titlePopupTitleEl.textContent = text;
      fitTitleFontSize();
      titlePopupEyebrowEl.classList.remove('swap-out');
      titlePopupTitleEl.classList.remove('swap-out');

      titlePopupBarEl.style.width = 'auto';
      const targetWidth = titlePopupBarEl.getBoundingClientRect().width;
      titlePopupBarEl.style.width = `${startWidth}px`;
      void titlePopupBarEl.offsetWidth; // reflow erzwingen, damit die Breite von hier aus animiert
      titlePopupBarEl.style.width = `${targetWidth}px`;

      titlePopupWidthResetTimeout = setTimeout(() => {
        titlePopupBarEl.style.width = '';
      }, 400);
    }, 220);
  }

  if (autoHideDelay !== null) {
    titlePopupHideTimeout = setTimeout(hideTitlePopup, autoHideDelay);
  }
}

function hideTitlePopup() {
  clearTimeout(titlePopupShowTimeout);
  clearTimeout(titlePopupHideTimeout);
  clearTimeout(titlePopupWidthResetTimeout);
  titlePopupEl.classList.remove('show');
  titlePopupBarEl.style.width = '';
}

function shuffle(arr) {
  const a = arr.slice();
  for (let i = a.length - 1; i > 0; i--) {
    const j = Math.floor(Math.random() * (i + 1));
    [a[i], a[j]] = [a[j], a[i]];
  }
  return a;
}

function randomSpotThreshold() {
  return 3 + Math.floor(Math.random() * 4); // 3 bis 6 (inklusiv)
}

function getNextSpot() {
  if (!spotPlaylist.length) return null;
  if (spotQueueIndex >= spotPlaylist.length) {
    spotPlaylist = shuffle(spotPlaylist);
    spotQueueIndex = 0;
  }
  return spotPlaylist[spotQueueIndex++];
}

function isVideoFile(name) {
  const ext = name.split('.').pop().toLowerCase();
  return VIDEO_EXTENSIONS.includes(ext);
}

async function collectVideoFiles(dirHandle) {
  // getFile() und Unterordner laufen parallel statt Datei für Datei nacheinander.
  async function walk(handle) {
    const pending = [];
    for await (const [name, entry] of handle.entries()) {
      if (entry.kind === 'file') {
        if (isVideoFile(name)) pending.push(entry.getFile());
      } else if (entry.kind === 'directory') {
        pending.push(walk(entry));
      }
    }
    return (await Promise.all(pending)).flat();
  }
  return walk(dirHandle);
}

// Fallback for browsers without File System Access API: <input webkitdirectory>
function collectFromFileList(fileList) {
  return Array.from(fileList).filter(f => isVideoFile(f.name));
}

async function chooseVideoFiles() {
  if (window.showDirectoryPicker) {
    const dirHandle = await window.showDirectoryPicker();
    return collectVideoFiles(dirHandle);
  }
  return pickWithInputFallback();
}

async function pickDirectory() {
  const previousText = statusEl.textContent;
  const previousSuccess = statusEl.classList.contains('success');
  statusEl.classList.remove('success');
  statusEl.textContent = 'Ordner wird gelesen…';
  pickBtn.disabled = true;
  try {
    const files = await chooseVideoFiles();

    if (!files.length) {
      statusEl.textContent = 'Keine Videodateien im gewählten Ordner gefunden.';
      pickBtn.disabled = false;
      return;
    }

    playlist = shuffle(files);
    statusEl.textContent = `✓ ${files.length} Video(s) gefunden und gemischt. Bereit zum Start.`;
    statusEl.classList.add('success');
    startBtn.disabled = false;
  } catch (err) {
    if (err.name === 'AbortError') {
      // Abbruch im Dialog: vorherigen Status wiederherstellen.
      statusEl.textContent = previousText;
      statusEl.classList.toggle('success', previousSuccess);
    } else {
      statusEl.textContent = 'Fehler beim Lesen des Ordners: ' + err.message;
    }
  } finally {
    pickBtn.disabled = false;
  }
}

async function pickSpotsDirectory() {
  const previousText = spotStatusEl.textContent;
  const previousSuccess = spotStatusEl.classList.contains('success');
  spotStatusEl.classList.remove('success');
  spotStatusEl.textContent = 'Spots-Ordner wird gelesen…';
  pickSpotsBtn.disabled = true;
  try {
    const files = await chooseVideoFiles();
    spotPlaylist = shuffle(files);
    spotQueueIndex = 0;
    if (files.length) {
      spotStatusEl.textContent = `✓ ${files.length} Spot(s) geladen – laufen alle 3–6 Videos dazwischen.`;
      spotStatusEl.classList.add('success');
    } else {
      spotStatusEl.textContent = 'Keine Videodateien im gewählten Ordner gefunden.';
    }
  } catch (err) {
    if (err.name === 'AbortError') {
      spotStatusEl.textContent = previousText;
      spotStatusEl.classList.toggle('success', previousSuccess);
    } else {
      spotStatusEl.textContent = 'Fehler beim Lesen des Spots-Ordners: ' + err.message;
    }
  } finally {
    pickSpotsBtn.disabled = false;
  }
}

function pickWithInputFallback() {
  return new Promise((resolve, reject) => {
    const input = document.createElement('input');
    input.type = 'file';
    input.webkitdirectory = true;
    input.multiple = true;
    input.onchange = () => resolve(collectFromFileList(input.files));
    // Ohne cancel-Handler bliebe das Promise bei Abbruch ewig offen und der Button gesperrt.
    input.oncancel = () => reject(new DOMException('Auswahl abgebrochen', 'AbortError'));
    input.click();
  });
}

function updateTopProgressBar() {
  const visible = !isSpotPlaying;
  topProgressBarEl.style.display = visible ? '' : 'none';
}

function playIndex(index) {
  if (index < 0 || index >= playlist.length) return;

  currentIndex = index;
  isSpotPlaying = false;
  updateTopProgressBar();

  const file = playlist[currentIndex];
  if (currentObjectUrl) URL.revokeObjectURL(currentObjectUrl);
  currentObjectUrl = URL.createObjectURL(file);
  videoEl.src = currentObjectUrl;
  logPlaybackStart(file, 'video');
  fileNameEl.textContent = file.name;
  counterEl.textContent = `${currentIndex + 1} / ${playlist.length}`;
  endingPopupShown = false;
  isSeeking = false;
  progressBar.value = 0;
  progressBar.style.setProperty('--progress', '0%');
  timeCurrentEl.textContent = '0:00';
  timeDurationEl.textContent = '0:00';
  hideTitlePopup(); // eine noch sichtbare Bauchbinde des vorigen Videos sofort ausblenden
  titlePopupShowTimeout = setTimeout(() => {
    showTitlePopup(formatTitleForDisplay(file.name), 'Jetzt läuft', START_POPUP_VISIBLE_TIME);
  }, START_POPUP_DELAY);
  topProgressBarFill.style.transform = 'scaleX(0)';
  videoEl.onended = () => playNext();
  safePlay();
}

videoEl.addEventListener('timeupdate', () => {
  if (currentIndex < 0) return;

  const { duration, currentTime } = videoEl;

  if (!isSpotPlaying && isFinite(duration) && duration > 0) {
    topProgressBarFill.style.transform = `scaleX(${currentTime / duration})`;
  }

  if (!isSeeking && isFinite(duration) && duration > 0) {
    progressBar.value = (currentTime / duration) * 100;
    progressBar.style.setProperty('--progress', `${(currentTime / duration) * 100}%`);
    // Text ändert sich nur einmal pro Sekunde, nicht bei jedem timeupdate.
    const label = formatTime(currentTime);
    if (timeCurrentEl.textContent !== label) timeCurrentEl.textContent = label;
  }

  if (isSpotPlaying || endingPopupShown || !isFinite(duration) || duration <= END_POPUP_LEAD_TIME * 2) return;
  if (duration - currentTime <= END_POPUP_LEAD_TIME) {
    endingPopupShown = true;
    showTitlePopup(formatTitleForDisplay(playlist[currentIndex].name), 'Das war', END_POPUP_VISIBLE_TIME);
  }
});

videoEl.addEventListener('loadedmetadata', () => {
  timeDurationEl.textContent = formatTime(videoEl.duration);
});

progressBar.addEventListener('input', () => {
  isSeeking = true;
  if (isFinite(videoEl.duration)) {
    const time = (progressBar.value / 100) * videoEl.duration;
    timeCurrentEl.textContent = formatTime(time);
    progressBar.style.setProperty('--progress', `${progressBar.value}%`);
  }
});

progressBar.addEventListener('change', () => {
  if (isFinite(videoEl.duration)) {
    videoEl.currentTime = (progressBar.value / 100) * videoEl.duration;
  }
  isSeeking = false;
});

// Nach Mausbedienung den Fokus abgeben, damit ←/→ wieder Zurück/Weiter auslösen.
// (Per Tastatur bedientes Slider-Fokus bleibt bewusst erhalten.)
progressBar.addEventListener('pointerup', () => {
  setTimeout(() => progressBar.blur(), 0);
});

videoEl.addEventListener('play', updatePauseButton);
videoEl.addEventListener('pause', updatePauseButton);
videoEl.addEventListener('playing', () => { consecutiveErrors = 0; });

videoEl.addEventListener('error', () => {
  // Nach stopPlayback() ist kein src mehr gesetzt – dann gibt es nichts zu behandeln.
  if (!playerEl.classList.contains('active') || !videoEl.getAttribute('src')) return;

  console.warn('Datei konnte nicht abgespielt werden:', fileNameEl.textContent, videoEl.error);
  consecutiveErrors++;

  if (!isSpotPlaying && consecutiveErrors >= playlist.length) {
    stopPlayback();
    statusEl.classList.remove('success');
    statusEl.textContent = 'Keines der Videos konnte abgespielt werden (Format vom Browser nicht unterstützt?).';
    return;
  }

  // Defekte Datei überspringen; ein Spot wird dabei nicht auf den Spot-Zähler angerechnet.
  isSpotPlaying = false;
  playNext({ afterSpot: true });
});

function playNext({ afterSpot = false } = {}) {
  // Weiter während eines Spots (oder nach Fehler) zählt nicht als abgespieltes Video.
  if (isSpotPlaying) afterSpot = true;

  if (!afterSpot && spotPlaylist.length) {
    videosSinceSpot++;
    if (videosSinceSpot >= spotThreshold) {
      videosSinceSpot = 0;
      spotThreshold = randomSpotThreshold();
      playSpot();
      return;
    }
  }

  if (currentIndex + 1 >= playlist.length) {
    playlist = shuffle(playlist);
    playIndex(0);
  } else {
    playIndex(currentIndex + 1);
  }
}

function playSpot() {
  const file = getNextSpot();
  if (!file) {
    playNext({ afterSpot: true });
    return;
  }

  isSpotPlaying = true;
  updateTopProgressBar();

  clearTimeout(titlePopupShowTimeout);
  hideTitlePopup();

  if (currentObjectUrl) URL.revokeObjectURL(currentObjectUrl);
  currentObjectUrl = URL.createObjectURL(file);
  videoEl.src = currentObjectUrl;
  safePlay();
  logPlaybackStart(file, 'spot');
  fileNameEl.textContent = file.name;
  isSeeking = false;
  progressBar.value = 0;
  progressBar.style.setProperty('--progress', '0%');
  timeCurrentEl.textContent = '0:00';
  timeDurationEl.textContent = '0:00';

  videoEl.onended = () => {
    isSpotPlaying = false;
    playNext({ afterSpot: true });
  };
}

function playPrev() {
  if (currentIndex <= 0) return;
  playIndex(currentIndex - 1);
}

async function startPlayback() {
  if (!playlist.length) return;
  setupEl.style.display = 'none';
  playerEl.classList.add('active');
  showControls();
  try {
    await playerEl.requestFullscreen();
  } catch (e) {
    // Vollbild evtl. nicht verfügbar – Wiedergabe läuft trotzdem weiter.
  }
  playIndex(0);
}

function stopPlayback() {
  videoEl.pause();
  videoEl.removeAttribute('src');
  videoEl.load();
  isSpotPlaying = false;
  updateTopProgressBar();
  if (currentObjectUrl) {
    URL.revokeObjectURL(currentObjectUrl);
    currentObjectUrl = null;
  }
  playerEl.classList.remove('active');
  playerEl.classList.remove('controls-visible');
  clearTimeout(controlsHideTimeout);
  hideTitlePopup();
  setupEl.style.display = 'flex';
  if (document.fullscreenElement) {
    document.exitFullscreen().catch(() => {});
  }
}

playerEl.addEventListener('mousemove', showControls);

pickBtn.addEventListener('click', pickDirectory);
pickSpotsBtn.addEventListener('click', pickSpotsDirectory);
pickLogFileBtn.addEventListener('click', pickLogFile);
startBtn.addEventListener('click', startPlayback);

prevBtn.addEventListener('click', playPrev);
nextBtn.addEventListener('click', () => playNext());
reshuffleBtn.addEventListener('click', () => {
  playlist = shuffle(playlist);
  playIndex(0);
});
pauseBtn.addEventListener('click', () => {
  if (videoEl.paused) {
    safePlay();
  } else {
    videoEl.pause();
  }
});
exitBtn.addEventListener('click', stopPlayback);

document.addEventListener('keydown', (e) => {
  if (!playerEl.classList.contains('active')) return;
  if (e.target === progressBar) return; // Slider soll Pfeiltasten selbst verarbeiten
  if (e.key === 'ArrowRight') playNext();
  else if (e.key === 'ArrowLeft') playPrev();
  else if (e.key === ' ') { e.preventDefault(); pauseBtn.click(); }
  else if (e.key === 'Escape') stopPlayback();
});

document.addEventListener('fullscreenchange', () => {
  if (!document.fullscreenElement && playerEl.classList.contains('active')) {
    stopPlayback();
  }
});

</script>
</body>
</html>
